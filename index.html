  .logo { width:42px; height:42px; border-radius:12px; background:var(--deep);

  .tb-text b { display:block; font-size:15px; }

  .pill.ok { background:#E4F1EE; color:#0A5A4E; }
  .pill.warnpill { background:#F7F0DB; color:#8A6D1F; }
  #status { flex:1; text-align:center; font-size:12.5px; color:var(--sub); min-width:200px; }
  #status.err { color:#C6403C; font-weight:600; }
  button.tb { border:none; border-radius:12px; padding:10px 16px; font-size:12.5px;
    font-weight:800; color:#fff; background:var(--deep); cursor:pointer; letter-spacing:.4px; }
  button.tb:hover { background:var(--teal); }
  button.tb.outline { background:#fff; color:var(--deep); border:2px solid var(--deep); }
  button.tb.outline:hover { background:var(--tint); }
  #drop { border:2px dashed #B7CCC7; border-radius:12px; padding:9px 14px;
    font-size:12px; color:var(--teal); font-weight:700; cursor:pointer;
    background:var(--tint); transition:.15s; }
  #drop.over, #drop:hover { border-color:var(--teal); background:#D6EAE5; }
  #file { display:none; }
  #warn { display:none; max-width:1240px; margin:16px auto -6px; padding:12px 18px;
    background:#F7F0DB; color:#7A5F16; border-radius:12px; font-size:12.5px; line-height:1.5; }
  #grid { max-width:1240px; margin:26px auto 60px; padding:0 20px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:24px; }
  .cell { background:#fff; border:1px solid var(--line); border-radius:18px;
    overflow:hidden; box-shadow:0 12px 34px rgba(16,33,31,.10); }
  .cellbar { display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 16px; border-bottom:1px solid var(--line); background:#FAFBFB; }
  .cellbar span { font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .cellbar button { border:none; color:#fff; font-weight:800; background:var(--deep);
    font-size:11.5px; padding:8px 12px; border-radius:9px; cursor:pointer; letter-spacing:.4px; }
  .cellbar button:disabled { opacity:.5; }
  .cellbar button.ghost { background:#fff; border:1.5px solid var(--deep); color:var(--deep); }
  .btns { display:flex; gap:6px; }
  .frame svg { width:100%; height:auto; display:block; }
  @media print { .topbar, .cellbar, #warn { display:none; } body { background:#fff; }
    #grid { display:block; } .cell { box-shadow:none; border:none; page-break-after:always; } }
</style>
</head>

  <script>/* MANCOM compact card renderer — pure string SVG, no DOM needed. */
(function (global) {
  var COLORS = {
    ink: '#10211F', sub: '#5B6B68', teal: '#0E7C6B', tealDeep: '#0A5A4E',
    tint: '#E4F1EE', mist: '#F1F5F4', line: '#E2EAE8',
    pri: { critical: '#C6403C', high: '#D97E0F', medium: '#C9A227', low: '#35915F' }
  };
  var PRI_LABEL = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // approximate text width (Helvetica-like)
  function chW(ch) {
    if (' iIljt.,:;\'!|('.indexOf(ch) >= 0) return 0.30;
    if ('frะ-"]) '.indexOf(ch) >= 0) return 0.36;
    if ('mwMW@'.indexOf(ch) >= 0) return 0.88;
    if (ch >= 'A' && ch <= 'Z') return 0.68;
    if (ch >= '0' && ch <= '9') return 0.56;
    return 0.52;
  }
  function measure(text, size, bold) {
    var w = 0; for (var i = 0; i < text.length; i++) w += chW(text[i]);
    return w * size * (bold ? 1.06 : 1);
  }
  function wrap(text, size, bold, maxW, maxLines) {
    var words = String(text).split(/\s+/), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var t = cur ? cur + ' ' + words[i] : words[i];
      if (measure(t, size, bold) <= maxW || !cur) cur = t;
      else { lines.push(cur); cur = words[i]; }
    }
    if (cur) lines.push(cur);
    if (maxLines && lines.length > maxLines) {
      lines = lines.slice(0, maxLines);
      var last = lines[maxLines - 1];
      while (measure(last + '…', size, bold) > maxW && last.length > 4)
        last = last.slice(0, -1).replace(/\s+$/, '');
      lines[maxLines - 1] = last + '…';
    }
    return lines;
  }
  function tspans(lines, x, y, lh) {
    return lines.map(function (l, i) {
      return '<tspan x="' + x + '" y="' + (y + i * lh) + '">' + esc(l) + '</tspan>';
    }).join('');
  }

  var DEF_THEME = { deep:'#0A5A4E', main:'#0E7C6B', tint:'#E4F1EE', mist:'#F1F5F4', alt:'#E8F0EE' };

  function renderCard(p, meta) {
    var TH = (p && p.theme) || DEF_THEME;
    var W = 1080, PAD = 64, IW = W - PAD * 2;
    var parts = [], y = 0;
    function add(s) { parts.push(s); }

    // ---------- header ----------
    y = 66;
    add('<rect x="' + PAD + '" y="' + y + '" width="92" height="92" rx="24" fill="' + TH.deep + '"/>' +
        '<text x="' + (PAD + 46) + '" y="' + (y + 58) + '" text-anchor="middle" font-size="30" font-weight="800" fill="#fff" letter-spacing="1">YDD</text>');
    add('<text x="' + (PAD + 114) + '" y="' + (y + 40) + '" font-size="30" font-weight="800" fill="' + COLORS.ink + '">MANCOM</text>');
    add('<text x="' + (PAD + 114) + '" y="' + (y + 72) + '" font-size="19" letter-spacing="3" fill="' + COLORS.sub + '">YOUTH DEVELOPMENT · WEEKLY OPERATIONS</text>');
    y += 92 + 58;

    add('<text x="' + PAD + '" y="' + y + '" font-size="27" font-weight="800" letter-spacing="1.5" fill="' + TH.main + '">MANCOM WEEKLY ACTION PASSPORT  ·  WEEK ' + esc(meta.week) + '</text>');
    y += 66;
    add('<text x="' + PAD + '" y="' + y + '" font-size="72" font-weight="800" letter-spacing="-1.5" fill="' + COLORS.ink + '">' + esc(p.name) + '</text>');
    y += 44;
    add('<text x="' + PAD + '" y="' + y + '" font-size="30" fill="' + COLORS.sub + '">' + esc(p.dept + ' · ' + p.position) + '</text>');
    y += 40;

    var nAct = p.active.length;
    var pillTxt = 'WEEK ' + meta.week + ' · ' + meta.dateStr.toUpperCase() + ' · ' +
      (nAct ? nAct + ' ACTIVE TASK' + (nAct !== 1 ? 'S' : '') : 'NO ACTIVE TASKS');
    var pw = measure(pillTxt, 26, true) + 64;
    add('<rect x="' + PAD + '" y="' + y + '" width="' + pw + '" height="58" rx="29" fill="' + TH.deep + '"/>' +
        '<text x="' + (PAD + 32) + '" y="' + (y + 38) + '" font-size="26" font-weight="800" letter-spacing="1" fill="#fff">' + esc(pillTxt) + '</text>');
    y += 58 + 52;

    // ---------- tasks ----------
    var MAXROWS = 7;
    if (nAct) {
      add('<text x="' + PAD + '" y="' + y + '" font-size="26" font-weight="800" letter-spacing="1.5" fill="' + TH.main + '">THIS WEEK · ASSIGNED ACTIONS</text>');
      y += 30;
      var shown = p.active.slice(0, MAXROWS);
      for (var i = 0; i < shown.length; i++) {
        var t = shown[i];
        var rightW = 220;
        var titleLines = wrap(t.action, 30, true, IW - 96 - rightW - 40, 2);
        var rowH = 58 + titleLines.length * 36 + 34;
        var bg = i % 2 === 0 ? TH.mist : TH.alt;
        add('<rect x="' + PAD + '" y="' + y + '" width="' + IW + '" height="' + rowH + '" rx="18" fill="' + bg + '"/>');
        add('<rect x="' + PAD + '" y="' + y + '" width="8" height="' + rowH + '" rx="4" fill="' + COLORS.pri[t.pri] + '"/>');
        var cy = y + rowH / 2;
        add('<circle cx="' + (PAD + 56) + '" cy="' + cy + '" r="27" fill="' + TH.deep + '"/>' +
            '<text x="' + (PAD + 56) + '" y="' + (cy + 10) + '" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">' + (i + 1) + '</text>');
        var tx = PAD + 100, ty = y + 56;
        add('<text font-size="30" font-weight="700" fill="' + COLORS.ink + '">' + tspans(titleLines, tx, ty, 36) + '</text>');
        var sub = (t.section ? t.section + '  ·  ' : '') + t.badge;
        var subLines = wrap(sub, 22, false, IW - 96 - rightW - 40, 1);
        add('<text font-size="22" fill="' + COLORS.sub + '">' + tspans(subLines, tx, ty + titleLines.length * 36, 26) + '</text>');
        var rx = PAD + IW - 30;
        add('<text x="' + rx + '" y="' + (cy - 6) + '" text-anchor="end" font-size="27" font-weight="800" fill="' + TH.deep + '">' + esc(t.due) + '</text>');
        add('<circle cx="' + (rx - measure(PRI_LABEL[t.pri], 22, false) - 20) + '" cy="' + (cy + 22) + '" r="6" fill="' + COLORS.pri[t.pri] + '"/>' +
            '<text x="' + rx + '" y="' + (cy + 29) + '" text-anchor="end" font-size="22" fill="' + COLORS.sub + '">' + PRI_LABEL[t.pri] + '</text>');
        y += rowH + 14;
      }
      if (nAct > MAXROWS) {
        add('<text x="' + PAD + '" y="' + (y + 26) + '" font-size="24" font-weight="700" fill="' + COLORS.sub + '">+ ' + (nAct - MAXROWS) + ' more action' + (nAct - MAXROWS !== 1 ? 's' : '') + ' on the full passport</text>');
        y += 52;
      }
      y += 12;
    } else {
      var ebH = 120;
      add('<rect x="' + PAD + '" y="' + y + '" width="' + IW + '" height="' + ebH + '" rx="18" fill="' + TH.tint + '"/>');
      add('<text x="' + (PAD + 30) + '" y="' + (y + 52) + '" font-size="34" font-weight="800" fill="' + TH.deep + '">No active assignments this week.</text>');
      add('<text x="' + (PAD + 30) + '" y="' + (y + 90) + '" font-size="22" letter-spacing="2.5" fill="' + TH.main + '" font-weight="700">PREVIOUS WEEK\u2019S HIGHLIGHTS BELOW</text>');
      y += ebH + 24;
      var acc = (p.accomplishments && p.accomplishments.length ? p.accomplishments : p.lastOpen || []).slice(0, 3);
      for (var j = 0; j < acc.length; j++) {
        var a = acc[j];
        var aLines = wrap(a.action, 28, true, IW - 96 - 180, 2);
        var aH = 50 + aLines.length * 34 + 26;
        add('<rect x="' + PAD + '" y="' + y + '" width="' + IW + '" height="' + aH + '" rx="18" fill="' + TH.mist + '"/>');
        add('<rect x="' + PAD + '" y="' + y + '" width="8" height="' + aH + '" rx="4" fill="' + COLORS.pri[a.pri || 'low'] + '"/>');
        add('<text font-size="28" font-weight="700" fill="' + COLORS.ink + '">' + tspans(aLines, PAD + 36, y + 50, 34) + '</text>');
        add('<text x="' + (PAD + IW - 30) + '" y="' + (y + 50) + '" text-anchor="end" font-size="24" font-weight="800" fill="' + TH.deep + '">' + esc(a.badge || '') + '</text>');
        y += aH + 14;
      }
      y += 12;
    }

    // ---------- shared box ----------
    if (p.shared && p.shared.length) {
      var sShown = p.shared.slice(0, 2);
      var sH = 62 + sShown.length * 40 + (p.shared.length > 2 ? 36 : 8) + 12;
      add('<rect x="' + PAD + '" y="' + y + '" width="' + IW + '" height="' + sH + '" rx="18" fill="' + TH.tint + '"/>');
      add('<text x="' + (PAD + 30) + '" y="' + (y + 46) + '" font-size="26" font-weight="800" letter-spacing="1" fill="' + TH.main + '">SHARED WITH ALL MANCOM  (' + p.shared.length + ')</text>');
      var sy = y + 88;
      for (var k = 0; k < sShown.length; k++) {
        var sLines = wrap(sShown[k].action, 25, false, IW - 110, 1);
        add('<circle cx="' + (PAD + 42) + '" cy="' + (sy - 8) + '" r="6" fill="' + TH.deep + '"/>');
        add('<text font-size="25" fill="' + COLORS.ink + '">' + tspans(sLines, PAD + 62, sy, 30) + '</text>');
        sy += 40;
      }
      if (p.shared.length > 2)
        add('<text x="' + (PAD + 62) + '" y="' + sy + '" font-size="22" fill="' + COLORS.sub + '">+ ' + (p.shared.length - 2) + ' more shared item' + (p.shared.length - 2 !== 1 ? 's' : '') + '</text>');
      y += sH + 26;
    }

    // ---------- footer ----------
    y += 20;
    add('<text x="' + (W / 2) + '" y="' + y + '" text-anchor="middle" font-size="23" fill="#9AA8A5">Compiled from the MANCOM weekly action sheet · Week ' + esc(meta.week) + ' · ' + esc(meta.dateLong) + '</text>');
    y += 56;

    var H = Math.max(y, 1080);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" font-family="Helvetica, Arial, \'Segoe UI\', sans-serif">' +
      '<rect width="' + W + '" height="' + H + '" rx="0" fill="#FFFFFF"/>' +
      '<rect x="0" y="0" width="' + W + '" height="10" fill="' + TH.deep + '"/>' +
      parts.join('') + '</svg>';

  <script>/* MANCOM Card Studio — live Google Sheet edition.
   Data source: Apps Script Web App (JSON). Falls back to embedded snapshot + .xlsx drop. */
(function () {
  'use strict';

  /* ================================================================
     1. CONFIG  — the only part you normally need to edit
     ================================================================ */
  var CONFIG = {
    // Paste the /exec URL of your deployed Apps Script Web App here:
    API_URL: 'https://script.google.com/macros/s/AKfycbxu0bYasICXR9zY_j_lkHtFtJHP4ncWjCLegsD7lF5dC9Z_zoTy8TnF5p4my8mIP0l1Hw/exec',

    // Auto re-check the sheet every N minutes (0 = off)
    REFRESH_MINUTES: 5,

    // Nicknames used in the Actionee column that aren't part of the person's
    // full name in the Members sheet.  alias (lowercase) -> full name.
    EXTRA_ALIASES: {
      'fasanya': 'Oluwatosin Deborah',
      'tosin': 'Oluwatosin Deborah',
      'odunayo': 'Odun Alomaja',
      'alomaja': 'Odun Alomaja',
      'abraham': 'MiponJesu',
      'miponjesu': 'MiponJesu',
      'bunmi': 'Oluwabunmi Akinboade',
      'cole': 'Seun Cole',
      'seun': 'Seun Cole',
      'olumide': 'Olumide Olaleye',
      'ayodeji': 'Ayodeji Makinde',
      'gamaliel': 'Gamaliel Adun',
      'daniel': 'Daniel Dakoru',
      'david': 'David Adesola',
      'paul': 'Paul Sobande',
      'isaac': 'Lawal Isaac',
      'nathaniel': 'Nathaniel Oladunmomi'
    },

    // Used only when the Members sheet has no Gender column.
    LADIES: ['Oluwatosin Deborah', 'Oluwabunmi Akinboade'],

    // Force a specific colour for anyone:  'Full Name': 'themeKey'
    // theme keys: rose plum magenta teal azure indigo violet emerald amber crimson slate rust cyan
    THEME_OVERRIDES: {}
  };

  /* ================================================================
     2. COLOUR THEMES
     ================================================================ */
  var THEMES = {
    rose:    { deep: '#9D2B5E', main: '#C7407C', tint: '#FCE7F0', mist: '#FBF2F6', alt: '#F7E4EE' },
    plum:    { deep: '#6D2B63', main: '#94408A', tint: '#F7E7F4', mist: '#FAF2F8', alt: '#F3E2F0' },
    magenta: { deep: '#8E2F5A', main: '#B84A7E', tint: '#FBE8F1', mist: '#FBF3F7', alt: '#F6E3EE' },
    teal:    { deep: '#0A5A4E', main: '#0E7C6B', tint: '#E4F1EE', mist: '#F1F5F4', alt: '#E8F0EE' },
    azure:   { deep: '#12557F', main: '#1B7BB5', tint: '#E3F0F8', mist: '#F0F5F9', alt: '#E1EEF7' },
    indigo:  { deep: '#33408C', main: '#4A5BC0', tint: '#E9EBF9', mist: '#F3F4FB', alt: '#E5E8F6' },
    violet:  { deep: '#5B3A8E', main: '#7A52B8', tint: '#EFE8F9', mist: '#F5F2FB', alt: '#EBE3F6' },
    emerald: { deep: '#1E6B41', main: '#2E9159', tint: '#E4F2E9', mist: '#F1F6F2', alt: '#E6F1EA' },
    amber:   { deep: '#8A5A11', main: '#B57E17', tint: '#FBF0DB', mist: '#F9F5EB', alt: '#F7EED8' },
    crimson: { deep: '#8E2B2B', main: '#B84141', tint: '#FBE8E8', mist: '#F9F2F2', alt: '#F7E3E3' },
    slate:   { deep: '#2E4756', main: '#456273', tint: '#E7EEF2', mist: '#F1F4F6', alt: '#E4EDF1' },
    rust:    { deep: '#8C4212', main: '#B65E22', tint: '#FBEBDF', mist: '#F9F3EC', alt: '#F7E7D9' },
    cyan:    { deep: '#0B5B66', main: '#127C8B', tint: '#E0F1F3', mist: '#EFF6F7', alt: '#DEEFF1' }
  };
  var LADY_POOL = ['rose', 'plum', 'magenta'];
  var MAN_POOL = ['teal', 'azure', 'indigo', 'emerald', 'amber', 'violet', 'slate', 'rust', 'crimson', 'cyan'];

  /* ================================================================
     3. Roster (built live from the Members sheet)
     ================================================================ */
  var FALLBACK_MEMBERS = [
    ['Lawal Isaac', 'Secretariat', 'Asst. Head'], ['Paul Sobande', 'Secretariat', 'Head'],
    ['Gamaliel Adun', 'Leadership', 'Weca Youth Leader'], ['David Adesola', 'C&E', 'Asst. Head'],
    ['Daniel Dakoru', 'C&E', 'Head'], ['Oluwatosin Deborah', 'Outreach', 'Asst. Head'],
    ['Odun Alomaja', 'Outreach', 'Head'], ['MiponJesu', 'AOG', 'Asst. Head'],
    ['Seun Cole', 'AOG', 'Head'], ['Ayodeji Makinde', 'S&P', 'Head'],
    ['Oluwabunmi Akinboade', 'S&P', 'Asst. Head'], ['Nathaniel Oladunmomi', 'Technology', 'Head'],
    ['Olumide Olaleye', 'Technology', 'Asst. Head']
  ];
  var MEMBERS = [], TEAMS = {}, DEPTS = {};
  var ALL_TOKENS = ['all mancom members', 'mancom', 'all departments', 'all mancom'];
  var PRI_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
  var MONTHS = { january: 0, february: 1, march: 2, april: 3, may: 4, june: 5, july: 6,
    august: 7, september: 8, october: 9, november: 10, december: 11 };
  var MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONFULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
    'September', 'October', 'November', 'December'];
  var UNMATCHED = {};

  function cleanTok(s) { return String(s).toLowerCase().replace(/[^a-z0-9&]/g, ''); }

  function buildRoster(memberRows) {
    MEMBERS = []; TEAMS = {}; DEPTS = {};
    var rows = [], cols = { name: 0, dept: 2, pos: 4, gender: -1, colour: -1 };
    if (memberRows && memberRows.length) {
      var headerIdx = -1;
      for (var r = 0; r < Math.min(memberRows.length, 10); r++) {
        var joined = (memberRows[r] || []).map(function (c) { return String(c || '').toLowerCase(); });
        if (joined.indexOf('name') >= 0) { headerIdx = r; break; }
      }
      if (headerIdx >= 0) {
        var hdr = memberRows[headerIdx].map(function (c) { return String(c || '').toLowerCase().trim(); });
        hdr.forEach(function (h, i) {
          if (h === 'name') cols.name = i;
          else if (h.indexOf('department') === 0 || h === 'dept') cols.dept = i;
          else if (h.indexOf('position') === 0 || h === 'role') cols.pos = i;
          else if (h === 'gender' || h === 'sex') cols.gender = i;
          else if (h === 'colour' || h === 'color' || h === 'theme') cols.colour = i;
        });
        rows = memberRows.slice(headerIdx + 1);
      } else { rows = memberRows; }
    }
    var built = [];
    rows.forEach(function (row) {
      if (!row) return;
      var name = String(row[cols.name] || '').trim();
      if (!name || name.toLowerCase() === 'name') return;
      built.push({
        name: name,
        dept: String(row[cols.dept] || '').trim() || '—',
        pos: String(row[cols.pos] || '').trim() || '',
        gender: cols.gender >= 0 ? String(row[cols.gender] || '').trim().toLowerCase() : '',
        colour: cols.colour >= 0 ? String(row[cols.colour] || '').trim().toLowerCase() : ''
      });
    });
    if (!built.length) {
      built = FALLBACK_MEMBERS.map(function (m) {
        return { name: m[0], dept: m[1], pos: m[2], gender: '', colour: '' };
      });
    }

    var ladyN = 0, manN = 0;
    built.forEach(function (m) {
      // aliases: every name token of 4+ chars, plus the full name
      var aliases = [];
      String(m.name).toLowerCase().split(/\s+/).forEach(function (tok) {
        tok = tok.replace(/[^a-z0-9]/g, '');
        if (tok.length >= 4) aliases.push(tok);
      });
      aliases.push(String(m.name).toLowerCase().trim());
      // extra aliases from CONFIG pointing at this person
      for (var a in CONFIG.EXTRA_ALIASES) {
        if (cleanTok(CONFIG.EXTRA_ALIASES[a]) === cleanTok(m.name)) aliases.push(a);
      }
      // theme
      var key = CONFIG.THEME_OVERRIDES[m.name] || (THEMES[m.colour] ? m.colour : '');
      if (!key) {
        var isLady = /^f/.test(m.gender) ||
          CONFIG.LADIES.some(function (n) { return cleanTok(n) === cleanTok(m.name); });
        key = isLady ? LADY_POOL[ladyN++ % LADY_POOL.length] : MAN_POOL[manN++ % MAN_POOL.length];
      }
      MEMBERS.push([m.name, m.dept, m.pos, aliases, THEMES[key] || THEMES.teal, key]);
      var dk = m.dept.toLowerCase().trim();
      if (dk && dk !== '—') (DEPTS[dk] = DEPTS[dk] || []).push(m.name);
    });
    // teams = departments (plus "<dept> team")
    for (var d in DEPTS) { TEAMS[d] = DEPTS[d]; TEAMS[d + ' team'] = DEPTS[d]; }
  }

  function wordMatch(alias, low) {
    return new RegExp('(^|[^a-z0-9])' + alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') +
      '([^a-z0-9]|$)').test(low);
  }

  function matchOne(low, people) {
    for (var a = 0; a < ALL_TOKENS.length; a++) {
      if (low === ALL_TOKENS[a] || low.indexOf(ALL_TOKENS[a]) === 0) return 'all';
    }
    if (TEAMS[low]) { TEAMS[low].forEach(function (m) { people[m] = 1; }); return true; }
    var lowNo = low.replace(/\.$/, '').replace(/\s+team$/, '');
    if (TEAMS[lowNo]) { TEAMS[lowNo].forEach(function (m) { people[m] = 1; }); return true; }
    for (var ea in CONFIG.EXTRA_ALIASES) {
      if (wordMatch(ea, low)) {
        var target = CONFIG.EXTRA_ALIASES[ea];
        for (var q = 0; q < MEMBERS.length; q++) {
          if (cleanTok(MEMBERS[q][0]) === cleanTok(target)) { people[MEMBERS[q][0]] = 1; return true; }
        }
      }
    }
    for (var i = 0; i < MEMBERS.length; i++) {
      var aliases = MEMBERS[i][3];
      for (var j = 0; j < aliases.length; j++) {
        if (wordMatch(aliases[j], low)) { people[MEMBERS[i][0]] = 1; return true; }
      }
    }
    return false;
  }

  function resolveActionees(raw) {
    var people = {}, sharedAll = false;
    var whole = String(raw).trim().toLowerCase();
    if (TEAMS[whole]) { TEAMS[whole].forEach(function (m) { people[m] = 1; }); return { people: people, sharedAll: false }; }
    String(raw).split(/[,/]/).forEach(function (part) {
      var t = part.trim(); if (!t) return;
      var low = t.toLowerCase().replace(/\(.*?\)/g, '').trim();
      if (!low) return;
      var res = matchOne(low, people);
      if (res === 'all') { sharedAll = true; return; }
      if (res) return;
      // try "C&E & AOG" style composites
      if (/ & /.test(low)) {
        var any = false;
        low.split(/ & /).forEach(function (piece) {
          var r2 = matchOne(piece.trim(), people);
          if (r2 === 'all') { sharedAll = true; any = true; }
          else if (r2) any = true;
        });
        if (any) return;
      }
      UNMATCHED[t] = (UNMATCHED[t] || 0) + 1;
    });
    return { people: people, sharedAll: sharedAll };
  }

  /* ================================================================
     4. Sheet parsing  (unchanged logic)
     ================================================================ */
  function parseSheetRows(rows) {
    var title = null, section = null, tasks = [], mode = 'active';
    if (!rows) return { title: null, tasks: [] };
    for (var r = 0; r < Math.min(rows.length, 400); r++) {
      var cells = (rows[r] || []).map(function (v) { return v == null ? '' : v; });
      var strs = cells.map(function (v) { return typeof v === 'number' ? v : String(v).trim(); });
      var nonEmpty = strs.filter(function (v) { return v !== '' && v != null; });
      if (!nonEmpty.length) continue;
      var first = strs[0];
      if (title === null && typeof first === 'string' && first.toUpperCase().indexOf('MANCOM') >= 0) { title = first; continue; }
      if (typeof first === 'string') {
        var up = first.toUpperCase();
        if (up.indexOf('CLOSED ITEMS') === 0) { mode = 'closed'; continue; }
        if (up.indexOf('CARRYOVER ITEMS') === 0) { mode = 'carryover'; continue; }
        if (up.indexOf('STATUS') === 0 && nonEmpty.length === 1) { mode = 'other'; continue; }
      }
      if (mode !== 'active') continue;
      if (typeof first === 'string' && /^\d+\.\s/.test(first) && nonEmpty.length === 1) {
        section = first.replace(/^\d+\.\s*/, '').trim(); continue;
      }
      if (first === 'S/N') continue;
      var sn = typeof first === 'number' ? first : (/^\d+(\.0)?$/.test(first) ? parseFloat(first) : null);
      if (sn !== null && cells.length >= 5) {
        tasks.push({
          sn: sn, action: String(strs[1] || ''), actioneeRaw: String(strs[2] || ''),
          dueRaw: cells[3], status: String(strs[4] || ''), remark: String(strs[5] || ''),
          section: section
        });
      }
    }
    return { title: title, tasks: tasks };
  }

  function serialToDate(n) { return new Date(Date.UTC(1899, 11, 30) + n * 86400000); }
  function dateLabel(d) { return d.getUTCDate() + ' ' + MON3[d.getUTCMonth()]; }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    var day = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - day + 3);
    var firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var fday = (firstThu.getUTCDay() + 6) % 7;
    firstThu.setUTCDate(firstThu.getUTCDate() - fday + 3);
    return 1 + Math.round((t - firstThu) / 604800000);
  }

  var URGENT = ['urgent', 'immediate', 'asap', 'today', 'before meeting', 'overdue',
    'deadline may not be met', 'major challenge'];

  function enrich(t, reportDate) {
    var d = null, label;
    if (typeof t.dueRaw === 'number' && t.dueRaw > 30000 && t.dueRaw < 60000) {
      d = serialToDate(t.dueRaw); label = dateLabel(d);
    } else {
      var s = String(t.dueRaw == null ? '' : t.dueRaw).trim();
      var isoM = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
      var dmy = /^(\d{1,2})[-\/ ]([A-Za-z]{3,})[-\/ ](\d{2,4})$/.exec(s);
      if (isoM) { d = new Date(Date.UTC(+isoM[1], +isoM[2] - 1, +isoM[3])); label = dateLabel(d); }
      else if (dmy) {
        var mn = -1, ml = dmy[2].toLowerCase();
        for (var mk in MONTHS) if (mk.indexOf(ml) === 0 || ml.indexOf(mk.slice(0, 3)) === 0) { mn = MONTHS[mk]; break; }
        if (mn >= 0) {
          var yr = +dmy[3]; if (yr < 100) yr += 2000;
          d = new Date(Date.UTC(yr, mn, +dmy[1])); label = dateLabel(d);
        } else label = s;
      }
      else label = (!s || s.toUpperCase() === 'TBD') ? 'TBD' : s;
    }
    t.dueDate = d; t.due = label;
    var status = t.status.toLowerCase(), text = (t.action + ' ' + t.remark).toLowerCase();
    var level = 1;
    if (status === 'closed' || status === 'info') level = 0;
    else {
      if (d) {
        var delta = Math.round((d - reportDate) / 86400000);
        level = delta < 0 ? 3 : (delta <= 8 ? 2 : 1);
      }
      for (var i = 0; i < URGENT.length; i++) if (text.indexOf(URGENT[i]) >= 0) {
        level = Math.max(level, 2);
        if (/deadline may not be met|urgent|immediate/.test(text)) level = 3;
      }
      if (text.indexOf('carryover') >= 0) level = Math.max(level, 2);
      if (text.indexOf('before camp') >= 0 && String(t.due).toLowerCase() === 'camp meeting') level = Math.max(level, 2);
    }
    t.pri = ['low', 'medium', 'high', 'critical'][level];
    var rm = t.remark.toLowerCase();
    if (status === 'closed') t.badge = 'COMPLETED';
    else if (status === 'info') t.badge = 'NOTED';
    else if (rm.indexOf('in progress') === 0 || rm.indexOf('work in progress') >= 0 || rm.slice(0, 40).indexOf('in progress') >= 0) t.badge = 'IN PROGRESS';
    else if (rm.indexOf('waiting') >= 0 || rm.indexOf('awaiting') >= 0 || rm.slice(0, 30).indexOf('pending') >= 0 || rm.indexOf('no response') >= 0) t.badge = 'WAITING';
    else t.badge = 'OPEN';
    var ra = resolveActionees(t.actioneeRaw);
    t.people = ra.people; t.sharedAll = ra.sharedAll;
  }

  function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9 ]/g, ''); }
  function similar(a, b) {
    var na = norm(a), nb = norm(b);
    if (na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0) return true;
    function grams(s) { var g = {}; for (var i = 0; i < s.length - 1; i++) g[s.substr(i, 2)] = (g[s.substr(i, 2)] || 0) + 1; return g; }
    var ga = grams(na), gb = grams(nb), inter = 0, ta = 0, tb = 0, k;
    for (k in ga) { ta += ga[k]; if (gb[k]) inter += Math.min(ga[k], gb[k]); }
    for (k in gb) tb += gb[k];
    return ta && tb ? (2 * inter) / (ta + tb) > 0.7 : false;
  }
  function serItem(t) {
    return {
      action: t.action, section: t.section || '', due: t.due,
      dueTs: t.dueDate ? +t.dueDate : null, badge: t.badge, pri: t.pri,
      remark: t.remark, owner: t.actioneeRaw,
      showOwner: Object.keys(t.people).length > 1 || /,|\//.test(t.actioneeRaw)
    };
  }

  function buildData(nowRows, lastRows, memberRows) {
    UNMATCHED = {};
    buildRoster(memberRows);
    var nowParsed = parseSheetRows(nowRows), lastParsed = parseSheetRows(lastRows);
    if (!nowParsed.tasks.length) throw new Error('No task rows found on the "Now" sheet');
    var m = /(\d{1,2})(st|nd|rd|th)?\s+(\w+)\s+(\d{4})/.exec(nowParsed.title || '');
    var reportDate;
    if (m && MONTHS[m[3].toLowerCase()] !== undefined) {
      reportDate = new Date(Date.UTC(+m[4], MONTHS[m[3].toLowerCase()], +m[1]));
    } else {
      var t0 = new Date(); reportDate = new Date(Date.UTC(t0.getFullYear(), t0.getMonth(), t0.getDate()));
    }
    var week = isoWeek(reportDate);
    nowParsed.tasks.forEach(function (t) { enrich(t, reportDate); });
    lastParsed.tasks.forEach(function (t) { enrich(t, reportDate); });

    var people = MEMBERS.map(function (mem) {
      var name = mem[0];
      var mineNow = nowParsed.tasks.filter(function (t) { return t.people[name]; });
      var active = mineNow.filter(function (t) { return ['closed', 'info'].indexOf(t.status.toLowerCase()) < 0; });
      active.sort(function (a, b) {
        var pr = PRI_RANK[a.pri] - PRI_RANK[b.pri]; if (pr) return pr;
        var da = a.dueDate ? +a.dueDate : Infinity, db = b.dueDate ? +b.dueDate : Infinity;
        if (da !== db) return da - db;
        return a.sn - b.sn;
      });
      var closedNow = mineNow.filter(function (t) { return ['closed', 'info'].indexOf(t.status.toLowerCase()) >= 0; });
      var shared = nowParsed.tasks.filter(function (t) { return t.sharedAll; });
      var mineLast = lastParsed.tasks.filter(function (t) { return t.people[name]; });
      var completedLast = mineLast.filter(function (t) { return t.status.toLowerCase() === 'closed'; });
      var openLast = mineLast.filter(function (t) { return t.status.toLowerCase() === 'open'; });
      var carried = 0, newCount = 0, dueWeek = 0, overdue = 0, high = 0;
      active.forEach(function (t) {
        var isCarried = (t.action + ' ' + t.remark).toLowerCase().indexOf('carryover') >= 0 ||
          mineLast.some(function (lt) { return similar(t.action, lt.action); });
        if (isCarried) carried++; else newCount++;
        if (t.dueDate) {
          var delta = Math.round((t.dueDate - reportDate) / 86400000);
          if (delta < 0) overdue++; else if (delta <= 7) dueWeek++;
        }
        if (t.pri === 'high' || t.pri === 'critical') high++;
      });
      return {
        name: name, dept: mem[1], position: mem[2], theme: mem[4], themeKey: mem[5],
        active: active.map(serItem),
        closedNow: closedNow.map(serItem),
        shared: shared.map(serItem),
        accomplishments: completedLast.map(function (t) {
          var d = serItem(t); d.badge = 'COMPLETED'; d.pri = 'low'; return d;
        }),
        lastOpen: openLast.map(serItem),
        stats: {
          dueWeek: dueWeek, overdue: overdue, high: high, carried: carried, newCount: newCount,
          completedLast: completedLast.length, openLast: openLast.length, totalLast: mineLast.length,
          completion: mineLast.length ? Math.round(100 * completedLast.length / mineLast.length) : null
        }
      };
    });
    return {
      week: week,
      dateStr: reportDate.getUTCDate() + ' ' + MON3[reportDate.getUTCMonth()] + ' ' + reportDate.getUTCFullYear(),
      dateLong: reportDate.getUTCDate() + ' ' + MONFULL[reportDate.getUTCMonth()] + ' ' + reportDate.getUTCFullYear(),
      people: people,
      unmatched: Object.keys(UNMATCHED)
    };
  }

  /* ================================================================
     5. Live loading from the Apps Script Web App
     ================================================================ */
  function jsonp(url, cb, errCb) {
    var name = 'mancomCB' + Date.now();
    var s = document.createElement('script');
    var timer = setTimeout(function () { cleanup(); errCb(new Error('Live request timed out')); }, 20000);
    function cleanup() { clearTimeout(timer); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function (data) { cleanup(); cb(data); };
    s.onerror = function () { cleanup(); errCb(new Error('Could not reach the Google Sheet service')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + name + '&t=' + Date.now();
    document.body.appendChild(s);
  }

  function fetchLive(cb, errCb) {
    var url = CONFIG.API_URL;
    if (!url || url.indexOf('PASTE_') === 0) { errCb(new Error('No API_URL configured')); return; }
    if (typeof fetch === 'function') {
      fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now())
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(cb)
        .catch(function () { jsonp(url, cb, errCb); });   // CORS/redirect fallback
    } else { jsonp(url, cb, errCb); }
  }

  /* ================================================================
     6. UI
     ================================================================ */
  var DATA = null, SOURCE = 'snapshot';
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var liveEl = document.getElementById('live');

  function setStatus(txt, cls) {
    statusEl.textContent = txt;
    statusEl.className = cls || '';
  }
  function stamp() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function svgToPng(svgStr, w, h, scale, cb) {
    var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(cb, 'image/png');
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert('PNG export failed in this browser.'); };
    img.src = url;
  }
  function download(blob, filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  function render() {
    if (!DATA) return;
    grid.innerHTML = '';
    DATA.people.forEach(function (p) {
      var out = window.CardRenderer.renderCard(p, DATA);
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.borderTop = '4px solid ' + p.theme.main;
      var bar = document.createElement('div');
      bar.className = 'cellbar';
      var label = document.createElement('span');
      label.innerHTML = '<i class="dot" style="background:' + p.theme.main + '"></i>' +
        p.name + ' — ' + p.active.length + ' active';
      var btns = document.createElement('div');
      btns.className = 'btns';
      var btn = document.createElement('button');
      btn.textContent = 'Card PNG';
      btn.style.background = p.theme.deep;
      btn.onclick = function () {
        btn.disabled = true; btn.textContent = 'Rendering…';
        svgToPng(out.svg, out.width, out.height, 2, function (blob) {
          download(blob, p.name.toUpperCase() + ' — WK' + DATA.week + '.png');
          btn.disabled = false; btn.textContent = 'Card PNG';
        });
      };
      var pbtn = document.createElement('button');
      pbtn.className = 'ghost'; pbtn.textContent = 'Passport';
      pbtn.style.color = p.theme.deep; pbtn.style.borderColor = p.theme.deep;
      pbtn.onclick = function () {
        var htmlStr = window.PassportRenderer.renderPassport(p, DATA);
        window.open(URL.createObjectURL(new Blob([htmlStr], { type: 'text/html' })), '_blank');
      };
      var dbtn = document.createElement('button');
      dbtn.className = 'ghost'; dbtn.textContent = '⇩ HTML';
      dbtn.style.color = p.theme.deep; dbtn.style.borderColor = p.theme.deep;
      dbtn.title = 'Download the full passport as an HTML file';
      dbtn.onclick = function () {
        var htmlStr = window.PassportRenderer.renderPassport(p, DATA);
        download(new Blob([htmlStr], { type: 'text/html' }), p.name.toUpperCase() + '.html');
      };
      btns.appendChild(btn); btns.appendChild(pbtn); btns.appendChild(dbtn);
      bar.appendChild(label); bar.appendChild(btns);
      var frame = document.createElement('div');
      frame.className = 'frame';
      frame.innerHTML = out.svg;
      cell.appendChild(bar); cell.appendChild(frame);
      grid.appendChild(cell);
    });
    var warn = document.getElementById('warn');
    if (DATA.unmatched && DATA.unmatched.length) {
      warn.style.display = '';
      warn.textContent = '⚠ ' + DATA.unmatched.length + ' actionee name(s) did not match anyone: ' +
        DATA.unmatched.join(' · ') + '  — add them to the Members sheet or to EXTRA_ALIASES.';
    } else { warn.style.display = 'none'; }
  }

  function applyData(d, source) {
    DATA = d; SOURCE = source;
    render();
    var tag = source === 'live' ? 'LIVE' : (source === 'file' ? 'FILE' : 'SNAPSHOT');
    liveEl.textContent = tag;
    liveEl.className = 'pill ' + (source === 'live' ? 'ok' : 'warnpill');
    setStatus('Week ' + d.week + ' · ' + d.dateLong + ' · ' + d.people.length + ' members · updated ' + stamp());
  }

  function loadLive(silent) {
    if (!silent) setStatus('Fetching the live Google Sheet…');
    fetchLive(function (res) {
      try {
        if (!res || res.ok === false) throw new Error(res && res.error ? res.error : 'Bad response');
        applyData(buildData(res.now, res.last, res.members), 'live');
      } catch (e) { setStatus('⚠ ' + e.message, 'err'); }
    }, function (err) {
      if (!DATA) {
        try { applyData(buildData(null, null, null), 'snapshot'); } catch (e) { /* ignore */ }
      }
      setStatus('⚠ Live sheet unavailable (' + err.message + ') — showing last snapshot', 'err');
    });
  }

  /* -------- offline .xlsx fallback (unchanged reader) -------- */
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }
  async function inflateRaw(bytes) {
    var ds = new DecompressionStream('deflate-raw');
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function unzip(arrayBuffer) {
    var b = new Uint8Array(arrayBuffer), eocd = -1;
    for (var i = b.length - 22; i >= Math.max(0, b.length - 66000); i--) {
      if (u32(b, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Not a valid .xlsx (zip) file');
    var count = u16(b, eocd + 10), cdOff = u32(b, eocd + 16), files = {}, p = cdOff;
    for (var n = 0; n < count; n++) {
      if (u32(b, p) !== 0x02014b50) break;
      var method = u16(b, p + 10), csize = u32(b, p + 20);
      var nlen = u16(b, p + 28), elen = u16(b, p + 30), clen = u16(b, p + 32), lho = u32(b, p + 42);
      files[new TextDecoder().decode(b.subarray(p + 46, p + 46 + nlen))] = { method: method, csize: csize, lho: lho };
      p += 46 + nlen + elen + clen;
    }
    async function read(name) {
      var f = files[name]; if (!f) return null;
      var q = f.lho, nl = u16(b, q + 26), el = u16(b, q + 28);
      var data = b.subarray(q + 30 + nl + el, q + 30 + nl + el + f.csize);
      return new TextDecoder().decode(f.method === 0 ? data : await inflateRaw(data));
    }
    return { read: read, names: Object.keys(files) };
  }
  function colIndex(ref) {
    var m = /^([A-Z]+)/.exec(ref); if (!m) return 0;
    var c = 0; for (var i = 0; i < m[1].length; i++) c = c * 26 + (m[1].charCodeAt(i) - 64);
    return c - 1;
  }
  async function readXlsx(arrayBuffer) {
    var z = await unzip(arrayBuffer), parser = new DOMParser();
    var wbXml = parser.parseFromString(await z.read('xl/workbook.xml'), 'application/xml');
    var relsXml = parser.parseFromString(await z.read('xl/_rels/workbook.xml.rels'), 'application/xml');
    var rels = {};
    Array.prototype.forEach.call(relsXml.getElementsByTagName('*'), function (r) {
      if (r.localName === 'Relationship') rels[r.getAttribute('Id')] = r.getAttribute('Target');
    });
    var sheets = {};
    Array.prototype.forEach.call(wbXml.getElementsByTagName('*'), function (s) {
      if (s.localName !== 'sheet') return;
      var rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      var target = rels[rid]; if (!target) return;
      if (target.indexOf('/') === 0) target = target.slice(1); else if (target.indexOf('xl/') !== 0) target = 'xl/' + target;
      sheets[s.getAttribute('name')] = target;
    });
    var sstRaw = await z.read('xl/sharedStrings.xml'), sst = [];
    if (sstRaw) {
      var sstXml = parser.parseFromString(sstRaw, 'application/xml');
      Array.prototype.forEach.call(sstXml.getElementsByTagName('*'), function (si) {
        if (si.localName !== 'si') return;
        var txt = '';
        Array.prototype.forEach.call(si.getElementsByTagName('*'), function (t) {
          if (t.localName === 't') txt += t.textContent;
        });
        sst.push(txt);
      });
    }
    async function rows(sheetName) {
      var path = sheets[sheetName]; if (!path) return null;
      var xml = parser.parseFromString(await z.read(path), 'application/xml'), out = [];
      Array.prototype.forEach.call(xml.getElementsByTagName('*'), function (row) {
        if (row.localName !== 'row') return;
        var arr = [];
        Array.prototype.forEach.call(row.childNodes, function (c) {
          if (c.localName !== 'c') return;
          var ci = colIndex(c.getAttribute('r') || ''), t = c.getAttribute('t'), v = null;
          if (t === 'inlineStr') v = c.textContent;
          else {
            for (var k = 0; k < c.childNodes.length; k++) {
              if (c.childNodes[k].localName === 'v') { v = c.childNodes[k].textContent; break; }
            }
            if (v != null) {
              if (t === 's') v = sst[parseInt(v, 10)];
              else if (t !== 'str' && t !== 'b') { var num = parseFloat(v); if (!isNaN(num)) v = num; }
            }
          }
          arr[ci] = v;
        });
        out.push(arr);
      });
      return out;
    }
    return { rows: rows, sheetNames: Object.keys(sheets) };
  }
  async function handleFile(file) {
    setStatus('Reading ' + file.name + '…');
    try {
      if (typeof DecompressionStream === 'undefined')
        throw new Error('This browser cannot unpack .xlsx — use Chrome, Edge, or Safari 16.4+');
      var wb = await readXlsx(await file.arrayBuffer());
      var nowName = wb.sheetNames.indexOf('Now') >= 0 ? 'Now' :
        (wb.sheetNames.indexOf('Sheet7') >= 0 ? 'Sheet7' : null);
      if (!nowName || wb.sheetNames.indexOf('Last') < 0)
        throw new Error('Workbook needs a "Now" (or Sheet7) and a "Last" sheet. Found: ' + wb.sheetNames.join(', '));
      var members = wb.sheetNames.indexOf('Members') >= 0 ? await wb.rows('Members') : null;
      applyData(buildData(await wb.rows(nowName), await wb.rows('Last'), members), 'file');
    } catch (e) { setStatus('⚠ ' + e.message, 'err'); }
  }

  /* -------- wiring -------- */
  document.getElementById('dl-passports').onclick = function () {
    DATA.people.forEach(function (p, i) {
      setTimeout(function () {
        download(new Blob([window.PassportRenderer.renderPassport(p, DATA)], { type: 'text/html' }),
          p.name.toUpperCase() + '.html');
      }, i * 350);
    });
  };
  document.getElementById('dl-all').onclick = function () {
    var i = 0;
    (function next() {
      if (i >= DATA.people.length) return;
      var p = DATA.people[i++];
      var out = window.CardRenderer.renderCard(p, DATA);
      svgToPng(out.svg, out.width, out.height, 2, function (blob) {
        download(blob, p.name.toUpperCase() + ' — WK' + DATA.week + '.png');
        setTimeout(next, 500);
      });
    })();
  };
  document.getElementById('refresh').onclick = function () { loadLive(false); };

  var drop = document.getElementById('drop'), input = document.getElementById('file');
  drop.onclick = function () { input.click(); };
  input.onchange = function () { if (input.files[0]) handleFile(input.files[0]); };
  drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function () { drop.classList.remove('over'); };
  drop.ondrop = function (e) {
    e.preventDefault(); drop.classList.remove('over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  };

  /* -------- boot -------- */
  var SNAP = window.EMBEDDED_ROWS || null;
  if (SNAP) {
    try { applyData(buildData(SNAP.now, SNAP.last, SNAP.members), 'snapshot'); } catch (e) { /* ignore */ }
  }
  loadLive(!!SNAP);
  if (CONFIG.REFRESH_MINUTES > 0) {
    setInterval(function () { loadLive(true); }, CONFIG.REFRESH_MINUTES * 60000);
  }

  window.__pipeline = { buildData: buildData, parseSheetRows: parseSheetRows, THEMES: THEMES, CONFIG: CONFIG };
})();
</script>
</body>
</html>
